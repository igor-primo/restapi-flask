apiVersion: apps/v1
kind: Deployment
metadata:
  labels: {{ include "restapi-flask.labels" . | nindent 4 }}
  name: {{ include "restapi-flask.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ include "restapi-flask.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "restapi-flask.fullname" . }} 
    spec:
      containers:
      - image: {{ .Values.image.registry | default "restapi-flask" }}:{{ .Values.image.tag | default "latest"}}
        name: api
        {{- if .Values.environmentVariables }}
        env:
        {{- toYaml .Values.environmentVariables | nindent 8 }}
        {{- end }}
        {{- if .Values.environmentVariablesFrom }}
        envFrom:
        {{- toYaml .Values.environmentVariablesFrom | nindent 8 }}
        {{- end }}
        {{- if .Values.livenessProbe }}
        livenessProbe:
        {{- toYaml .Values.livenessProbe | nindent 10 }}
        {{ else }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.appPort }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
        {{- toYaml .Values.readinessProbe | nindent 10 }}
        {{ else }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.appPort }}
        {{- end }}

  # TODO: seek ways to avoid the difficulties in parameterizing
  # this devilish thing. Issues:
  #   1. Too verbose
  #   2. Too repetitive (too much copying)
  #   3. Go parsing gives rise to unsafe parsing
  #   4. I have to edit at least 2 files, this one 'values.yaml'
